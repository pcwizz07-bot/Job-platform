services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - job-data:/app/backend/data
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-random-secret}
      - DB_PATH=/app/backend/data/jobs.db

  # Optional: nginx reverse proxy
  # Uncomment if you want nginx on port 80 instead of using the host's nginx
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - app

volumes:
  job-data: